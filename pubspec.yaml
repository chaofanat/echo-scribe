name: echo_scribe
description: "Offline real-time speech transcription built on sherpa-onnx."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  audio_decoder:
    path: packages/audio_decoder
  audio_io: ^0.6.1
  cupertino_icons: ^1.0.8
  ffi: ^2.1.0
  file_picker: ^8.3.0
  material_ui: ^1.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  record: ^6.1.2
  sherpa_onnx: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.0

dependency_overrides:
  # Patched fork of audio_io 0.6.1: WASAPI loopback WITHOUT process-exclusion
  # — upstream's VAD Process_Loopback activation fails ("Failed to retrieve
  # IMMDevice") even on current builds, and EchoScribe plays no audio itself,
  # so plain endpoint loopback is the better fit (and works on Windows 10).
  # Drop the override once upstream offers a plain-loopback option.
  audio_io:
    path: third_party/audio_io
  # audio_io <=0.6.1 pins web ^0.5.1 for its web backend; on Windows that
  # backend is never loaded (conditional import), so force the modern web
  # required by sherpa_onnx_web.
  web: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    # NOTE: directory assets are not recursive; when switching models,
    # update these entries together with lib/asr/model_config.dart.
    - assets/models/sherpa-onnx-x-asr-960ms-streaming-zipformer-transducer-zh-en-punct-int8-2026-06-05/
    - assets/models/sherpa-onnx-pyannote-segmentation-3-0/
    - assets/models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
