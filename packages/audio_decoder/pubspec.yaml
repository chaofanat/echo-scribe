name: audio_decoder
description: >-
  Decode audio files (WAV/MP3/FLAC) to mono PCM16 at a target sample rate
  via a bundled miniaudio native library (Windows).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0

dependencies:
  ffi: ^2.1.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      windows:
        ffiPlugin: true
